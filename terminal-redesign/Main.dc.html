<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <style>
    :root{
      --mono:'SF Mono','JetBrains Mono','Roboto Mono',ui-monospace,Menlo,Consolas,monospace;
      --text:#e8e8e6; --dim:#8f9096; --faint:#4d4e53;
      --long:#2dd4a7; --short:#f0564f;
      --accent:#e8a33d;
      --line:rgba(255,255,255,.09);
      --bg:#0a0a0a; --panel:#0d0d0d;
    }
    *{box-sizing:border-box}
    html,body{margin:0;height:100%;background:var(--bg);color:var(--text);font-family:var(--mono);
      -webkit-font-smoothing:antialiased;text-rendering:optimizeLegibility;overflow:hidden}

    .app{width:100vw;height:100vh;display:flex;flex-direction:column;min-width:1100px;min-height:700px;background:var(--bg)}

    /* ================= TOPBAR ================= */
    .topbar{height:48px;flex:none;display:flex;align-items:center;gap:16px;padding:0 18px;
      background:var(--panel);border-bottom:1px solid var(--line);}
    .logo{display:flex;align-items:center;gap:8px;font-weight:700;font-size:12.5px;letter-spacing:.06em;color:var(--dim)}
    .logo .brk{width:6px;height:6px;background:var(--accent)}

    .symblk{display:flex;align-items:baseline;gap:10px}
    .symblk .tk{font-weight:700;font-size:14px;letter-spacing:.02em;color:var(--text)}
    .symblk .px{font-size:14px;font-weight:700;color:var(--text)}
    .symblk .chg{font-size:11px;font-weight:700;color:var(--long)}

    .tb-spacer{flex:1}
    .tbicon{width:26px;height:26px;display:flex;align-items:center;justify-content:center;cursor:pointer;color:var(--faint);
      transition:color .12s ease}
    .tbicon:hover{color:var(--dim)}
    .tbicon svg{width:14px;height:14px}

    /* ================= BODY LAYOUT ================= */
    .body{flex:1;display:flex;min-height:0}

    /* ================= CHART AREA ================= */
    .chartwrap{flex:1;position:relative;min-width:0;display:flex;flex-direction:column;background:var(--bg)}
    .plotrow{flex:1;display:flex;min-height:0}
    .plot{flex:1;position:relative;min-width:0}
    .plot svg{display:block;width:100%;height:100%}
    .gridline{stroke:rgba(255,255,255,.035);stroke-width:1}

    .yaxis{width:56px;flex:none;position:relative}
    .ytick{position:absolute;right:10px;left:0;font-size:10px;color:var(--faint);transform:translateY(-50%);text-align:right;pointer-events:none}
    .axpx{position:absolute;left:8px;right:8px;font-size:10.5px;font-weight:700;color:#0a0a0a;padding:3px 6px;text-align:center;
      transform:translateY(-50%);white-space:nowrap;}

    .xaxis{height:22px;flex:none;display:flex;position:relative;margin-right:56px}
    .xtick{position:absolute;top:4px;bottom:0;display:flex;align-items:flex-start;font-size:10px;color:var(--faint);
      transform:translateX(-50%);pointer-events:none}

    .lvlline{position:absolute;left:0;right:0;height:1px;border-top:1px dashed;pointer-events:none;opacity:.55}
    .lvltag{position:absolute;right:10px;font-size:9.5px;font-weight:700;letter-spacing:.03em;
      transform:translateY(-50%);white-space:nowrap}

    .symtag{position:absolute;top:16px;left:16px;font-size:11px;font-weight:700;color:var(--dim);letter-spacing:.02em;opacity:.7}

    /* ================= BOTTOM BAR ================= */
    .bottombar{height:32px;flex:none;display:flex;align-items:center;gap:2px;padding:0 18px;
      background:var(--panel);border-top:1px solid var(--line)}
    .ivbtn{height:32px;padding:0 10px;font-size:10.5px;font-weight:700;color:var(--faint);cursor:pointer;
      display:flex;align-items:center;border-bottom:2px solid transparent}
    .ivbtn:hover{color:var(--dim)}
    .ivbtn.on{color:var(--accent);border-bottom-color:var(--accent)}
    .bb-spacer{flex:1}
    .tzstamp{font-size:10px;color:var(--faint)}
  </style>
</helmet>

<div class="app">
  <div class="topbar">
    <div class="logo"><span class="brk"></span>SWAGINO</div>
    <div class="symblk">
      <span class="tk">QQQ</span>
      <span class="px">602.14</span>
      <span class="chg">+0.42%</span>
    </div>
    <div class="tb-spacer"></div>
    <div class="tbicon" title="Theme">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>
    </div>
    <div class="tbicon" title="Settings">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 00.34 1.87l.06.06a2 2 0 11-2.83 2.83l-.06-.06a1.7 1.7 0 00-1.87-.34 1.7 1.7 0 00-1 1.55V21a2 2 0 01-4 0v-.09A1.7 1.7 0 009 19.4a1.7 1.7 0 00-1.87.34l-.06.06a2 2 0 11-2.83-2.83l.06-.06A1.7 1.7 0 004.6 15a1.7 1.7 0 00-1.55-1H3a2 2 0 010-4h.09A1.7 1.7 0 004.6 9a1.7 1.7 0 00-.34-1.87l-.06-.06a2 2 0 112.83-2.83l.06.06A1.7 1.7 0 009 4.6a1.7 1.7 0 001-1.55V3a2 2 0 014 0v.09a1.7 1.7 0 001 1.55 1.7 1.7 0 001.87-.34l.06-.06a2 2 0 112.83 2.83l-.06.06A1.7 1.7 0 0019.4 9a1.7 1.7 0 001.55 1H21a2 2 0 010 4h-.09a1.7 1.7 0 00-1.51 1z"/></svg>
    </div>
  </div>

  <div class="body">
    <div class="chartwrap">
      <div class="plotrow">
        <div class="plot">
          <svg viewBox="0 0 900 560" preserveAspectRatio="none">
            <line class="gridline" x1="0" y1="93" x2="900" y2="93"/>
            <line class="gridline" x1="0" y1="186" x2="900" y2="186"/>
            <line class="gridline" x1="0" y1="279" x2="900" y2="279"/>
            <line class="gridline" x1="0" y1="372" x2="900" y2="372"/>
            <line class="gridline" x1="0" y1="465" x2="900" y2="465"/>
            <g id="candles"></g>
          </svg>

          <div class="symtag">QQQ · 5</div>

          <div class="lvlline" style="top:21.4%;border-color:var(--short)"></div>
          <div class="lvltag" style="top:21.4%;color:var(--short)">605.00</div>
          <div class="lvlline" style="top:69.6%;border-color:var(--long)"></div>
          <div class="lvltag" style="top:69.6%;color:var(--long)">597.00</div>
        </div>
        <div class="yaxis" id="yaxis">
          <div class="axpx" id="axpx" style="top:37.5%;background:var(--long)">602.14</div>
        </div>
      </div>
      <div class="xaxis" id="xaxis"></div>
    </div>
  </div>

  <div class="bottombar">
    <div class="ivbtn">1M</div>
    <div class="ivbtn on">5M</div>
    <div class="ivbtn">15M</div>
    <div class="ivbtn">1H</div>
    <div class="ivbtn">D</div>
    <div class="bb-spacer"></div>
    <div class="tzstamp">09:41:22 ET</div>
  </div>
</div>

</x-dc>
<script data-dc-script>
(function(){
  const seeds=[601.2,602.8,600.9,603.4,602.1,604.0,603.2,605.1,604.3,602.7,601.9,600.5,599.8,601.1,602.6,603.9,602.4,601.0,600.2,601.8,603.1,604.6,603.8,602.2,601.4,600.7,602.0,603.5,604.8,606.1,605.4,604.0,602.9,601.7,600.9,602.3,603.7,604.2,603.0,601.6,602.14];
  const n=seeds.length, w=900, h=560, top=30, bot=530;
  const lo=Math.min(...seeds)-1.2, hi=Math.max(...seeds)+1.2;
  const y=v=>top+(hi-v)/(hi-lo)*(bot-top);
  const cw=(w-40)/n;
  const g=document.querySelector('#candles');
  let svg='';
  for(let i=0;i<n;i++){
    const openV = i===0?seeds[0]-0.4:seeds[i-1];
    const closeV = seeds[i];
    const hiV = Math.max(openV,closeV)+ (0.3+ (i%3)*0.15);
    const loV = Math.min(openV,closeV)- (0.3+ (i%4)*0.12);
    const up = closeV>=openV;
    const x = 20 + i*cw + cw*0.18;
    const bw = cw*0.64;
    const yO=y(openV), yC=y(closeV), yH=y(hiV), yL=y(loV);
    const bodyTop=Math.min(yO,yC), bodyH=Math.max(2,Math.abs(yC-yO));
    const col = up? 'var(--long)':'var(--short)';
    svg += `<line x1="${x+bw/2}" y1="${yH}" x2="${x+bw/2}" y2="${yL}" stroke="${col}" stroke-width="1.2" opacity=".95"/>`;
    svg += `<rect x="${x}" y="${bodyTop}" width="${bw}" height="${bodyH}" fill="${up?'transparent':col}" stroke="${col}" stroke-width="1.2"/>`;
  }
  g.innerHTML = svg;

  const gridYs=[93,186,279,372,465];
  const yaxis=document.querySelector('#yaxis');
  let yticks='';
  gridYs.forEach(yv=>{
    const price = hi - (yv-top)/(bot-top)*(hi-lo);
    yticks += `<div class="ytick" style="top:${(yv/h*100).toFixed(2)}%">${price.toFixed(2)}</div>`;
  });
  yaxis.insertAdjacentHTML('afterbegin', yticks);

  const lastPx=seeds[n-1];
  const axpx=document.querySelector('#axpx');
  axpx.style.top=(y(lastPx)/h*100).toFixed(2)+'%';
  axpx.textContent=lastPx.toFixed(2);

  const xaxisEl=document.querySelector('#xaxis');
  let xticks='';
  for(let i=0;i<n;i+=5){
    const totalMin = 30 + i*5;
    const hh = 9 + Math.floor(totalMin/60);
    const mm = totalMin%60;
    const label = `${hh}:${String(mm).padStart(2,'0')}`;
    const xc = 20 + i*cw + cw*0.5;
    xticks += `<div class="xtick" style="left:${(xc/w*100).toFixed(2)}%">${label}</div>`;
  }
  xaxisEl.innerHTML = xticks;
})();
</script>
<script data-dc-script>
class Component extends DCLogic {
  state = {};
  renderVals(){ return this.state; }
}
</script>
</body>
</html>
