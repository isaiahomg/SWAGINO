# Push-to-deploy: when you push to `main`, this copies the app to your droplet and rebuilds.
#
# Uses ONLY the official actions/checkout plus plain ssh/scp (no third-party deploy actions,
# so there's no supply-chain surface). It authenticates with a dedicated deploy key you install
# once (see DEPLOY.md, Part G). The Tradier token is NOT here — it lives in .env on the droplet.
#
# Required repo secrets (Settings -> Secrets and variables -> Actions):
#   DROPLET_HOST      your droplet's IP or hostname        (e.g. 203.0.113.45)
#   DROPLET_USER      the sudo user you created            (e.g. swagino)
#   DEPLOY_SSH_KEY    the PRIVATE half of the deploy key   (full contents, incl. the BEGIN/END lines)
# Optional but recommended (pins the server's identity so a first-connect can't be spoofed):
#   DROPLET_KNOWN_HOSTS   output of:  ssh-keyscan YOUR_DROPLET_IP

name: Deploy SWAGINO

on:
  push:
    branches: [main]
  workflow_dispatch: {}          # lets you trigger a deploy by hand from the Actions tab

concurrency:                     # never let two deploys race each other
  group: deploy-production
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up SSH
        env:
          KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          HOST: ${{ secrets.DROPLET_HOST }}
          KNOWN: ${{ secrets.DROPLET_KNOWN_HOSTS }}
        run: |
          mkdir -p ~/.ssh && chmod 700 ~/.ssh
          printf '%s\n' "$KEY" > ~/.ssh/id_deploy
          chmod 600 ~/.ssh/id_deploy
          if [ -n "$KNOWN" ]; then
            printf '%s\n' "$KNOWN" > ~/.ssh/known_hosts    # pinned host key: strongest
          else
            ssh-keyscan -H "$HOST" >> ~/.ssh/known_hosts 2>/dev/null  # trust-on-first-use fallback
          fi
          chmod 600 ~/.ssh/known_hosts

      - name: Copy app files to droplet
        env:
          HOST: ${{ secrets.DROPLET_HOST }}
          USER: ${{ secrets.DROPLET_USER }}
        run: |
          # .env is NEVER copied — it stays on the droplet with your token.
          scp -i ~/.ssh/id_deploy \
            proxy.py swagino.html Dockerfile docker-compose.yml \
            c799f001526d973d5e323d94542fe589.ico \
            "$USER@$HOST:~/swagino/"

      - name: Rebuild and restart
        env:
          HOST: ${{ secrets.DROPLET_HOST }}
          USER: ${{ secrets.DROPLET_USER }}
        run: |
          ssh -i ~/.ssh/id_deploy "$USER@$HOST" \
            'cd ~/swagino && docker compose up -d --build && docker compose ps'
